[opener]
okular = [
  { run = 'okular "$@"', orphan = true, desc = "Open with Okular" },
]

nvim = [
  { run = 'nvim "$@"', block = true, desc = "Open with Neovim" },
]

zed = [
  { run = 'zed "$@"', orphan = true, desc = "Open with Zed" },
]

[open]
rules = [
  { name = "*.pdf", use = "okular" },

  { name = "*.txt", use = "nvim", and = "zed" },
  { name = "*.md",  use = "nvim", and = "zed" },
  { name = "*.log", use = "nvim", and = "zed" },

  { name = "*.c,*.h,*.cpp,*.hpp,*.cc,*.hh", use = "nvim", and = "zed" },
  { name = "*.rs",  use = "nvim", and = "zed" },
  { name = "*.hs",  use = "nvim", and = "zed" },
  { name = "*.py",  use = "nvim", and = "zed" },
  { name = "*.js,*.mjs,*.cjs", use = "nvim", and = "zed" },
  { name = "*.ts,*.tsx", use = "nvim", and = "zed" },
  { name = "*.jsx", use = "nvim", and = "zed" },
  { name = "*.java", use = "nvim", and = "zed" },
  { name = "*.kt,*.kts", use = "nvim", and = "zed" },
  { name = "*.sh,*.bash,zshrc,*.zsh", use = "nvim", and = "zed" },
  { name = "*.lua", use = "nvim", and = "zed" },
  { name = "*.json,*.yaml,*.yml,*.toml", use = "nvim", and = "zed" },
  { name = "*.nix", use = "nvim", and = "zed" },
]
